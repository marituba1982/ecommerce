<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seu Carrinho</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
   <header class="site-header">
    <div class="container">
        <a href="index.html" class="logo">Logo</a>
        <button id="nav-toggle" aria-label="Abrir menu">☰</button>
        <nav id="site-nav" class="site-nav">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li>
                    <a href="carrinho.html" id="cart-link" aria-label="Carrinho">
                        Carrinho 🛒 <span id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>

    <main>
        <section class="container">
            <h1>Seu Carrinho de Compras</h1>
            
            <div id="cart-items" class="cart-list">
                <p>Seu carrinho está vazio.</p>
            </div>

            <div id="cart-summary" class="cart-summary" style="display:none;">
                <div class="total-row">
                    <span>Total:</span>
                    <span id="cart-total">R$ 0,00</span>
                </div>
                <div class="actions">
                    <a href="index.html" class="btn-outline">Continuar Comprando</a>
                    <a href="contato.html" class="btn-submit">Finalizar Compra</a>
                </div>
            </div>
        </section>
    </main>
    
    <script src="./js/scripts.js" type="module"></script>
</body>
</html>
